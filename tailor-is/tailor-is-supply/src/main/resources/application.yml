# ============================================================
# TODO [架构对齐]: 架构方案要求非核心模块采用 SpringBoot 单体 + 插件化架构
# 当前为独立微服务部署，后续版本需重构为：
# 1. 合并至单一 SpringBoot 应用（如 tailor-is-lite）
# 2. 按功能模块插件化（community/academy/supply 作为独立 Maven 模块）
# 3. 共享数据库连接池和缓存
# 参考: docs/architecture/Tailor IS（裁智云）服装全产业平台架构优化方案.md
# ============================================================
server:
  port: ${SERVER_PORT:8109}

spring:
  application:
    name: tailor-is-supply
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        enabled: ${SPRING_CLOUD_NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_ADDR:host.docker.internal:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        register-enabled: ${SPRING_CLOUD_NACOS_DISCOVERY_REGISTER_ENABLED:true}
        fail-fast: ${SPRING_CLOUD_NACOS_DISCOVERY_FAIL_FAST:false}
        port: ${SERVER_PORT:8109}
        watch:
          enabled: false
        auth:
          username: ${NACOS_USERNAME:}
          password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        file-extension: yaml
        import-check:
          enabled: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/tailor_is_supply?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      connection-init-sqls:
        - SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.tailoris.supply.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  timeout: 1800
  active-timeout: 7200
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-redis: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

# ============================================================
# 缓存分层：Redis Standalone 配置（非核心服务）
# 启用方式: 设置 REDIS_MODE=standalone 环境变量（默认）
# 更轻量：小连接池、短超时
# ============================================================
tailoris:
  redis:
    mode: ${REDIS_MODE:standalone}
    standalone:
      timeout: 2000
      pool:
        max-active: 10
        max-idle: 5
        min-idle: 1
        max-wait: 2000

logging:
  level:
    com.tailoris.supply: info

---
spring.config.activate.on-profile: prod
knife4j:
  enable: false
springdoc:
  api-docs:
    enabled: false
