# ==============================================================================
# Tailor IS 生产环境 Docker Compose 配置 (v4.0 规范)
# ==============================================================================
# 版本: v4.0
# 启动所有微服务一键拉起:
#   docker compose -f docker-compose.prod.yml up -d --build
# 停止: docker compose -f docker-compose.prod.yml down
# 查看状态: docker compose -f docker-compose.prod.yml ps
# 查看日志: docker compose -f docker-compose.prod.yml logs -f
# 单独构建某服务: docker compose -f docker-compose.prod.yml build <service>
#
# 端口规范:
#   网关层: core-gateway=9000, lite-gateway=8081
#   核心业务: admin=8100, user=8101, product=8102, order=8103, payment=8104
#             marketing=8105, ai=8106, copyright=8107, merchant=8110, pattern=8115
#   轻量业务: community=8108, supply=8109, message=8111, academy=8112
#             analytics=8113, message-im=8114
# ==============================================================================

volumes:
  prometheus-data: { name: tailor-is-prometheus-data }
  alertmanager-data: { name: tailor-is-alertmanager-data }
  grafana-data: { name: tailor-is-grafana-data }
  nginx-logs: { name: tailor-is-nginx-logs }
  ssl-certs: { name: tailor-is-ssl-certs }

x-restart-policy: &restart-policy
  restart: unless-stopped

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"
    tag: "{{.Name}}"

x-resources: &default-resources
  limits:
    cpus: '0.25'
    memory: 1024M
  reservations:
    cpus: '0.1'
    memory: 256M

x-charset-config: &charset-config
  JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
  SPRING_HTTP_ENCODING_ENABLED: "true"
  SPRING_HTTP_ENCODING_CHARSET: "UTF-8"
  SPRING_HTTP_ENCODING_FORCE: "true"

x-java-opts: &java-opts
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=45 -XX:G1ReservePercent=10 -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1 -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=40 -Dserver.tomcat.threads.min-spare=5 -Dserver.tomcat.max-connections=200 -Dserver.tomcat.accept-count=50"

x-java-opts-gateway: &java-opts-gateway
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=45 -XX:G1ReservePercent=10 -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1 -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=60 -Dserver.tomcat.threads.min-spare=10 -Dserver.tomcat.max-connections=500 -Dserver.tomcat.accept-count=100"

x-java-ai-opts: &java-ai-opts
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=45 -XX:G1ReservePercent=10 -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1 -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=40 -Dserver.tomcat.threads.min-spare=5"

x-java-common: &java-common
  JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
  SPRING_HTTP_ENCODING_ENABLED: "true"
  SPRING_HTTP_ENCODING_CHARSET: "UTF-8"
  SPRING_HTTP_ENCODING_FORCE: "true"
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=45 -XX:G1ReservePercent=10 -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1 -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=40 -Dserver.tomcat.threads.min-spare=5 -Dserver.tomcat.max-connections=200 -Dserver.tomcat.accept-count=50"

x-java-common-gateway: &java-common-gateway
  JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
  SPRING_HTTP_ENCODING_ENABLED: "true"
  SPRING_HTTP_ENCODING_CHARSET: "UTF-8"
  SPRING_HTTP_ENCODING_FORCE: "true"
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=45 -XX:G1ReservePercent=10 -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1 -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=60 -Dserver.tomcat.threads.min-spare=10 -Dserver.tomcat.max-connections=500 -Dserver.tomcat.accept-count=100"

x-java-common-ai: &java-common-ai
  JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
  SPRING_HTTP_ENCODING_ENABLED: "true"
  SPRING_HTTP_ENCODING_CHARSET: "UTF-8"
  SPRING_HTTP_ENCODING_FORCE: "true"
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=45 -XX:G1ReservePercent=10 -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1 -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=40 -Dserver.tomcat.threads.min-spare=5"

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tailor-is-prometheus
    hostname: prometheus
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    <<: *restart-policy
    logging: *default-logging
    user: "65534:65534"
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 1024M }
        reservations: { cpus: '0.1', memory: 128M }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9200/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: tailor-is-alertmanager
    hostname: alertmanager
    network_mode: host
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.1', memory: 256M }
        reservations: { cpus: '0.05', memory: 64M }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9202/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana:10.4.0
    container_name: tailor-is-grafana
    hostname: grafana
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel,grafana-clock-panel"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 512M }
        reservations: { cpus: '0.1', memory: 128M }
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9201/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  admin-service:
    image: tailor-is/admin-service:latest
    container_name: tailor-is-admin-service
    hostname: admin-service
    network_mode: host
    build:
      context: ../tailor-is
      dockerfile: ./tailor-is-admin/Dockerfile
    env_file:
      - ./tailor-is-prod/env/.env.base
      - ./tailor-is-prod/env/.env.dev
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      JVM_XMX: 220m
      JVM_XMS: 128m
      SERVER_PORT: "8100"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: localhost:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/tailor_is_user?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: localhost
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-rabbitmq}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AES_KEY: ${AES_KEY}
      <<: *java-common
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.20', memory: 384M }
        reservations: { cpus: '0.05', memory: 128M }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  user-service:
    image: tailor-is/user-service:latest
    container_name: tailor-is-user-service
    hostname: user-service
    network_mode: host
    build:
