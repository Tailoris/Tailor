    image: tailor-is-analytics:latest
    container_name: tailor-is-analytics
    hostname: analytics-service
    environment:
      - SERVER_PORT=8113
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/tailor_is_analytics?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8113/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s