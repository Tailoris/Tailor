# =============================================================================
# Tailor IS Nginx 统一配置 (v4.0 网关统一收敛架构)
# 对应: Phase 1 / P1-6 / H-04
# 部署位置: 1Panel OpenResty 或独立 Nginx
# 核心原则: 所有 API 流量必须经过网关，禁止直连业务微服务
# 权威声明: 本文件为 Nginx 唯一配置源，default.conf 已废弃
# =============================================================================

# 速率限制 zone 定义 (http 上下文)
include /etc/nginx/rate-limiting.conf;

# 字符集配置 - 确保所有响应都使用UTF-8
charset utf-8;
charset_types text/html text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml;

# WebSocket 升级配置
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# =============================================================================
# 上游服务定义 (唯一合法上游：两个网关 + GraphQL)
# 禁止定义任何业务微服务直连 upstream
# =============================================================================
upstream tailoris_core_gateway {
    server tailor-is-core-gateway:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream tailoris_lite_gateway {
    server tailor-is-lite-gateway:8081 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# upstream tailoris_graphql {
#     server host.docker.internal:4000 max_fails=3 fail_timeout=30s;
#     keepalive 32;
# }

# =============================================================================
# 后端服务 (HTTP 模式)
# =============================================================================
server {
    listen 80;
    server_name _;

    # FE-H-7: 生产环境强制 HTTPS 重定向 (开发环境注释掉)
    # if ($http_x_forwarded_proto = "http") {
    #     return 301 https://$host$request_uri;
    # }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https:; img-src 'self' data: https:; font-src 'self' data: https:; script-src 'self' https:; style-src 'self' https:" always;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 客户端真实 IP
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;

    # ================================================================
    # PC 商城 (Vue 3 + Element Plus + SSR)
    # ================================================================
    location / {
        root /usr/share/nginx/html/pc-mall;
        try_files $uri $uri/ /index.html;
        index index.html;

        # SPA 缓存策略: 入口文件不缓存, 静态资源长缓存
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ================================================================
    # 商户后台
    # ================================================================
    location /merchant/ {
        alias /usr/share/nginx/html/merchant-admin/;
        try_files $uri $uri/ /merchant/index.html;
        index index.html;

        location = /merchant/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location ~* /merchant/.*\.(js|css|woff2?|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location ~* /merchant/.*\.(png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ================================================================
    # 平台管理
    # ================================================================
    location /admin/ {
        alias /usr/share/nginx/html/platform-admin/;
        try_files $uri $uri/ /admin/index.html;
        index index.html;

        location = /admin/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location ~* /admin/.*\.(js|css|woff2?|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location ~* /admin/.*\.(png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ================================================================
    # API 路由 - Lite Gateway (轻量服务: community, supply, message, academy, analytics, im)
    # 优先级: 先匹配轻量服务，再匹配核心服务
    # ================================================================
    location ~ ^/api/v1/(community|post|comment|supply|message|notice|academy|course|analytics|metrics|dashboard|im)(/|$) {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://tailoris_lite_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ================================================================
    # API 路由 - Core Gateway (核心业务: user, auth, product, order, payment, marketing, ai, copyright, merchant, admin, pattern)
    # ================================================================
    # 登录接口速率限制 10r/m (防暴力破解, ^~ 优先于正则匹配)
    location ^~ /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://tailoris_core_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/api/v1/(user|auth|product|favorite|order|cart|payment|settlement|account|sandbox|marketing|coupon|points|seckill|ai|body-size|copyright|merchant|shop|admin|pattern)(/|$) {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://tailoris_core_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ================================================================
    # 默认 /api/ 兜底（v4.0 规范要求统一 /api/v1/ 前缀，旧 /api/ 路由已废弃）
    # 保留兜底以避免 404，但日志告警提示迁移
    # ================================================================
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://tailoris_core_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header X-Deprecation "This API prefix is deprecated. Use /api/v1/ instead." always;
    }

    # ================================================================
    # WebSocket - 通过 lite-gateway 转发 IM 聊天服务
    # v4.0 优化: WebSocket 统一经过网关，由网关校验 Token 和限制连接数
    # ================================================================
    location /ws/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://tailoris_lite_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # ================================================================
    # GraphQL Gateway (暂未启用)
    # ================================================================
    # location /graphql {
    #     proxy_pass http://tailoris_graphql;
    #     proxy_set_header Host $host;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_read_timeout 60s;
    # }

    # ================================================================
    # 健康检查
    # ================================================================
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ================================================================
    # 监控指标 (仅内网)
    # ================================================================
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        access_log off;
    }

    # ================================================================
    # Actuator 端点 - 禁止外网访问
    # 注意：Docker 容器健康检查直接访问容器内部端口（如 localhost:8101/actuator/health），
    # 不经过 Nginx 代理，因此此 deny 规则不影响容器健康检查。
    # ================================================================
    location ~* /actuator/ {
        deny all;
        return 403;
    }

    # ================================================================
    # 错误页面
    # ================================================================
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}