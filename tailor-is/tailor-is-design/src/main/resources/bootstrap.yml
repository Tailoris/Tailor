spring:
  application:
    name: tailor-is-design
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        file-extension: yaml
        shared-configs:
          - data-id: common-config.yaml
            namespace: ${NACOS_NAMESPACE:dev}
            group: DEFAULT_GROUP
            refresh: true