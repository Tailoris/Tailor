global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'tailor-is-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'localhost:8100'  # admin
        - 'localhost:8101'  # user
        - 'localhost:8102'  # product
        - 'localhost:8103'  # order
        - 'localhost:8104'  # payment
        - 'localhost:8105'  # marketing
        - 'localhost:8106'  # ai
        - 'localhost:8107'  # copyright
        - 'localhost:8108'  # community
        - 'localhost:8109'  # supply
        - 'localhost:8110'  # merchant
        - 'localhost:8111'  # message
        - 'localhost:8112'  # academy
        - 'localhost:8113'  # analytics
        - 'localhost:8114'  # message-im
        - 'localhost:8115'  # pattern
        - 'localhost:9000'  # core-gateway
        - 'localhost:8081'  # lite-gateway