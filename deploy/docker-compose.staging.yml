version: '3.8'

services:
  # ============================================================
  # 中间件服务由 1Panel 统一管理，不在此文件中重新映射端口
  # ============================================================

  # ============================================================
  # 数据库
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: tailor-is-mysql-staging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql_staging}
      MYSQL_DATABASE: tailor_is
      MYSQL_USER: tailor
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tailor_staging}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../tailor-is/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: tailor-is-redis-staging
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_staging}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # RabbitMQ
  # ============================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tailor-is-rabbitmq-staging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_staging}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # Nacos
  # ============================================================
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: tailor-is-nacos-staging
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-SecretKey0123456789}
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: ${MYSQL_USERNAME:-tailor}
      MYSQL_SERVICE_PASSWORD: ${MYSQL_PASSWORD:-tailor_staging}
    volumes:
      - nacos-data:/home/nacos/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================================
  # 核心网关
  # ============================================================
  core-gateway:
    image: tailor-is/core-gateway:latest
    container_name: tailor-is-core-gateway-staging
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SERVER_PORT: "9000"
      NACOS_ADDR: localhost:8848
      MYSQL_HOST: localhost
      REDIS_HOST: localhost
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_staging}
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ============================================================
  # Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: tailor-is-prometheus-staging
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================
  # Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: tailor-is-grafana-staging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-grafana_staging}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
  prometheus-data:
  grafana-data:
