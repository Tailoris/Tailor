# ==============================================================================
# Tailor IS - Nginx CDN 缓存规则
# ==============================================================================
# 使用方式: 在 nginx server 块中 include 此文件
#   include /etc/nginx/conf.d/cdn-cache.conf;
# ==============================================================================

# ==============================================================================
# 1. 版本化资源 (带 hash) - 长期缓存 (1年)
#    文件名包含 8 位以上 hex hash，如 app.a1b2c3d4.js
# ==============================================================================
location ~* \.[a-f0-9]{8,}\.(js|css)$ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    add_header Access-Control-Allow-Origin "*";
    add_header Timing-Allow-Origin "*";
    access_log off;
    gzip_static on;
}

# ==============================================================================
# 2. 图片资源 - 长期缓存 (90天)
# ==============================================================================
location ~* \.(jpg|jpeg|gif|png|webp|svg|ico|bmp)$ {
    expires 90d;
    add_header Cache-Control "public, max-age=7776000, immutable";
    add_header Vary "Accept";
    add_header Access-Control-Allow-Origin "*";
    add_header Timing-Allow-Origin "*";
    access_log off;
    gzip_static on;
}

# ==============================================================================
# 3. 字体文件 - 永久缓存 (1年)
# ==============================================================================
location ~* \.(woff|woff2|ttf|otf|eot)$ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "https://www.tailoris.com";
    add_header Access-Control-Allow-Methods "GET, OPTIONS";
    add_header Access-Control-Max-Age "86400";
    add_header Vary "Origin";
    access_log off;
    gzip_static on;
}

# ==============================================================================
# 4. 非版本化 JS/CSS - 短期缓存 (1小时)
# ==============================================================================
location ~* \.(js|css)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header Vary "Accept-Encoding";
    add_header Access-Control-Allow-Origin "*";
    add_header Timing-Allow-Origin "*";
    gzip_static on;
}

# ==============================================================================
# 5. HTML 文件 - 不缓存
# ==============================================================================
location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    add_header Pragma "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Access-Control-Allow-Origin "*";
}

# ==============================================================================
# 6. JSON 数据文件 - 短期缓存 (5分钟)
# ==============================================================================
location ~* \.json$ {
    expires 5m;
    add_header Cache-Control "public, max-age=300, must-revalidate";
    add_header Access-Control-Allow-Origin "*";
    add_header Vary "Origin";
    gzip_static on;
}

# ==============================================================================
# 7. 视频/音频媒体 - 长期缓存 (30天)
# ==============================================================================
location ~* \.(mp4|webm|ogg|mp3|wav|flac|aac)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header Access-Control-Allow-Origin "*";
    add_header Accept-Ranges "bytes";
    access_log off;
}

# ==============================================================================
# 8. PDF 文档 - 中期缓存 (7天)
# ==============================================================================
location ~* \.pdf$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
}

# ==============================================================================
# 9. Service Worker - 不缓存
# ==============================================================================
location ~* /service-worker\.js$ {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Service-Worker-Allowed "/";
}

# ==============================================================================
# 10. CDN 回源请求头
# ==============================================================================
# CDN 服务商接入说明:
#   阿里云 CDN: 将源站域名 CNAME 解析到阿里云 CDN 域名，在 CDN 控制台配置回源策略
#     回源域名: origin.tailoris.com
#     缓存规则: 与下方 location 规则保持一致
#     参考文档: https://help.aliyun.com/product/27132.html
#   腾讯云 CDN: 在 CDN 控制台添加加速域名，配置回源 HOST 和缓存规则
#     参考文档: https://cloud.tencent.com/document/product/228
#   CloudFront (AWS): 创建 Distribution，Origin Domain 指向源站
#     参考文档: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/
#   Cloudflare: 将域名 NS 或 CNAME 指向 Cloudflare，开启 CDN 和 WAF 功能
#     参考文档: https://developers.cloudflare.com/cache/
#
# 通用配置要点:
#   1. 配置回源 Host 头为 www.tailoris.com
#   2. 开启 Gzip/Brotli 压缩
#   3. 配置 HTTPS 回源
#   4. 配置缓存键规则: 忽略 URL 参数中的 _t、_v 等版本参数
#   5. 配置缓存预热: 主动预热首页、商品列表页等高频页面
# ==============================================================================
# 当 CDN 回源时，添加以下头以优化 CDN 行为
set $cdn_header "";
if ($http_user_agent ~* "CDN|AliyunCDN|CloudFront") {
    set $cdn_header "1";
}
add_header X-CDN-Cache-Status "HIT" always;
add_header CDN-Cache-Control "public, max-age=31536000" always;