# ==============================================================================
# Tailor IS 生产环境 Docker Compose 配置
# ==============================================================================
# 版本: v2.0 (微服务集群版)
# 启动所有微服务一键拉起:
#   docker compose -f docker-compose.prod.yml up -d --build
# 停止: docker compose -f docker-compose.prod.yml down
# 查看状态: docker compose -f docker-compose.prod.yml ps
# 查看日志: docker compose -f docker-compose.prod.yml logs -f
# 单独构建某服务: docker compose -f docker-compose.prod.yml build <service>
#
# 注意: 当前配置使用 localhost 连接宿主机上的中间件服务。
# 如需在纯 Docker 环境中运行（中间件也在容器内），请将 localhost
# 替换为对应的 Docker 服务名:
#   localhost → mysql       (MySQL)
#   localhost → redis       (Redis)
#   localhost → rabbitmq    (RabbitMQ)
#   localhost → nacos       (Nacos)
# 健康检查中的 localhost 也应改为 localhost
# ==============================================================================


volumes:
  # ============ 数据卷: 持久化存储 ============
  prometheus-data: { name: tailor-is-prometheus-data }
  alertmanager-data: { name: tailor-is-alertmanager-data }
  grafana-data: { name: tailor-is-grafana-data }
  nginx-logs: { name: tailor-is-nginx-logs }
  ssl-certs: { name: tailor-is-ssl-certs }

x-restart-policy: &restart-policy
  restart: unless-stopped

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"
    tag: "{{.Name}}"

x-resources: &default-resources
  limits:
    cpus: '0.25'
    memory: 1024M
  reservations:
    cpus: '0.1'
    memory: 256M

x-charset-config: &charset-config
  JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
  SPRING_HTTP_ENCODING_ENABLED: "true"
  SPRING_HTTP_ENCODING_CHARSET: "UTF-8"
  SPRING_HTTP_ENCODING_FORCE: "true"

# ==============================================================================
# 基础设施层 (Infrastructure)
# ==============================================================================
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tailor-is-prometheus
    hostname: prometheus
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    
    <<: *restart-policy
    logging: *default-logging
    user: "65534:65534"
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 1024M }
        reservations: { cpus: '0.1', memory: 128M }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: tailor-is-alertmanager
    hostname: alertmanager
    network_mode: host
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.1', memory: 256M }
        reservations: { cpus: '0.05', memory: 64M }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana:10.4.0
    container_name: tailor-is-grafana
    hostname: grafana
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel,grafana-clock-panel"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 512M }
        reservations: { cpus: '0.1', memory: 128M }
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# ==============================================================================
# 认证/用户服务 (微服务模块)
# ==============================================================================
  user-service:
    image: tailor-is/user-service:latest
    container_name: tailor-is-user-service
    hostname: user-service
    network_mode: host
    build:
      context: ../tailor-is
      dockerfile: ./tailor-is-user/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      JVM_XMX: 1024m
      JVM_XMS: 512m
      SERVER_PORT: "8101"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: localhost:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:-}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:-}
      SPRING_CLOUD_NACOS_CONFIG_USERNAME: ${NACOS_USERNAME:-}
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: ${NACOS_PASSWORD:-}
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/tailor_is_user?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-tailor}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: localhost
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-rabbitmq}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AES_KEY: ${AES_KEY}
      <<: *charset-config
    
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 1536M }
        reservations: { cpus: '0.1', memory: 384M }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

