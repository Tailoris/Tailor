apiVersion: batch/v1
kind: CronJob
metadata:
  name: scale-down-lite-idle-hours
  namespace: tailor-is-prod
  labels:
    app.kubernetes.io/name: scale-down-lite-idle-hours
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: tailor-is
spec:
  # 每天 22:00 北京时间 (UTC 14:00) 执行缩容，将 lite-services 缩到 0
  schedule: "0 14 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: scale-down-sa
          containers:
            - name: scale-down-lite
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  echo "=== 闲时缩容 lite-services 开始: $(date) ==="

                  echo "缩容 academy 到 0 副本..."
                  kubectl scale deployment academy --replicas=0 -n tailor-is-prod

                  echo "缩容 admin 到 0 副本..."
                  kubectl scale deployment admin --replicas=0 -n tailor-is-prod

                  echo "缩容 community 到 0 副本..."
                  kubectl scale deployment community --replicas=0 -n tailor-is-prod

                  echo "缩容 marketing 到 0 副本..."
                  kubectl scale deployment marketing --replicas=0 -n tailor-is-prod

                  echo "缩容 supply 到 0 副本..."
                  kubectl scale deployment supply --replicas=0 -n tailor-is-prod

                  echo "缩容 message 到 0 副本..."
                  kubectl scale deployment message --replicas=0 -n tailor-is-prod

                  echo "缩容 analytics 到 0 副本..."
                  kubectl scale deployment analytics --replicas=0 -n tailor-is-prod

                  echo "缩容 message-im 到 0 副本..."
                  kubectl scale deployment message-im --replicas=0 -n tailor-is-prod

                  echo "缩容 pattern 到 0 副本..."
                  kubectl scale deployment pattern --replicas=0 -n tailor-is-prod

                  echo "=== 闲时缩容 lite-services 完成: $(date) ==="
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "100m"
                  memory: "128Mi"
          restartPolicy: OnFailure
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scale-up-lite-peak-hours
  namespace: tailor-is-prod
  labels:
    app.kubernetes.io/name: scale-up-lite-peak-hours
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: tailor-is
spec:
  # 每天 06:00 北京时间 (UTC 22:00 前一天) 恢复 lite-services 到 1 副本
  schedule: "0 22 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: scale-down-sa
          containers:
            - name: scale-up-lite
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  echo "=== 高峰时段扩容 lite-services 开始: $(date) ==="

                  echo "扩容 academy 到 1 副本..."
                  kubectl scale deployment academy --replicas=1 -n tailor-is-prod

                  echo "扩容 admin 到 1 副本..."
                  kubectl scale deployment admin --replicas=1 -n tailor-is-prod

                  echo "扩容 community 到 1 副本..."
                  kubectl scale deployment community --replicas=1 -n tailor-is-prod

                  echo "扩容 marketing 到 1 副本..."
                  kubectl scale deployment marketing --replicas=1 -n tailor-is-prod

                  echo "扩容 supply 到 1 副本..."
                  kubectl scale deployment supply --replicas=1 -n tailor-is-prod

                  echo "扩容 message 到 1 副本..."
                  kubectl scale deployment message --replicas=1 -n tailor-is-prod

                  echo "扩容 analytics 到 1 副本..."
                  kubectl scale deployment analytics --replicas=1 -n tailor-is-prod

                  echo "扩容 message-im 到 1 副本..."
                  kubectl scale deployment message-im --replicas=1 -n tailor-is-prod

                  echo "扩容 pattern 到 1 副本..."
                  kubectl scale deployment pattern --replicas=1 -n tailor-is-prod

                  echo "=== 高峰时段扩容 lite-services 完成: $(date) ==="
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "100m"
                  memory: "128Mi"
          restartPolicy: OnFailure
