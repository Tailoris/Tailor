rules:
  - key: RP-001
    name: "API路径前缀必须为/api/v1"
    description: "Controller类的@RequestMapping路径必须以/api/v1/开头"
    severity: BLOCKER
    type: CODE_SMELL
    tags:
      - "api"
      - "route"
      - "规范"
    pattern: "^@RequestMapping\\s*\\(\\s*[\"'](?!/api/v1/)[^\"']*[\"']\\s*\\)"

  - key: RP-002
    name: "服务端口必须落在指定区间"
    description: "server.port必须落在v4.0规范定义的端口段内"
    severity: BLOCKER
    type: CODE_SMELL
    tags:
      - "port"
      - "规范"
    pattern: "server\\.port\\s*=\\s*(?!(808[0-9]|809[0-9]|810[0-9]|811[0-9]|812[0-9]|813[0-9]|814[0-9]|900[0-1]))[0-9]+"

  - key: RP-003
    name: "路由路径禁止硬编码"
    description: "Controller中禁止硬编码路由路径，必须使用RoutePortConstant常量"
    severity: CRITICAL
    type: CODE_SMELL
    tags:
      - "constant"
      - "route"
      - "规范"
    pattern: "@RequestMapping\\s*\\(\\s*[\"']/api/v1/[^\"']*[\"']\\s*\\)"

  - key: RP-004
    name: "Admin Controller必须位于admin-service"
    description: "Admin开头的Controller类必须位于tailor-is-admin模块中"
    severity: MAJOR
    type: CODE_SMELL
    tags:
      - "admin"
      - "architecture"
    pattern: "class Admin.*Controller"

  - key: RP-005
    name: "网关路由必须使用服务发现格式"
    description: "网关路由uri必须使用lb://tailor-is-{service}格式，禁止硬编码http://host:port"
    severity: BLOCKER
    type: CODE_SMELL
    tags:
      - "gateway"
      - "route"
      - "规范"
    pattern: "uri\\s*=\\s*(?!lb://tailor-is-)[^,\\s]+"

  - key: RP-006
    name: "端口常量必须与RoutePortConstant一致"
    description: "application.yml中的server.port必须引用RoutePortConstant定义的值"
    severity: MAJOR
    type: CODE_SMELL
    tags:
      - "port"
      - "constant"
      - "规范"
    pattern: "server\\.port\\s*=\\s*[^$][0-9]+"

  - key: DC-001
    name: "Docker Compose端口映射必须与常量一致"
    description: "docker-compose.yml中的端口映射必须与RoutePortConstant定义一致"
    severity: BLOCKER
    type: CODE_SMELL
    tags:
      - "docker"
      - "port"
      - "规范"

  - key: NG-001
    name: "Nginx上游服务配置必须正确"
    description: "Nginx配置中的上游服务端口必须与网关端口一致"
    severity: BLOCKER
    type: CODE_SMELL
    tags:
      - "nginx"
      - "gateway"
      - "规范"