# ==============================================================================
# Tailor IS - Docker Compose 核心微服务编排 (v4.0 规范)
# ==============================================================================
# 任务溯源:
#   Phase 0 / C-01  - 微服务 Docker 镜像构建
#   Phase 0 / C-02  - Spring Boot 版本统一 (父 POM 3.3.5)
#   Phase 2 / P2-1  - 网关路由规则 (见 CoreGatewayRouteConfig.java)
#   Phase 2 / P2-3  - 消息队列集成 (RabbitMQ / RocketMQ 通过 Nacos 自动发现)
#   Phase 3 / P3-1  - k6 性能测试 (见 deploy/perf/smoke-test.js)
# ==============================================================================
# 前置条件:
#   1. 构建镜像前: `mvn -f tailor-is/pom.xml clean package -DskipTests`
#      或直接使用本 compose 的 build 阶段, 每个服务的 Dockerfile 已集成 Maven 构建
#   2. 所有基础设施（MySQL/Redis/Nacos/RabbitMQ）由本 compose 统一管理
#   3. 将本文件所在目录中的 .env.example 复制为 .env 并填入真实密码
# ==============================================================================
# 使用方式:
#   cp deploy/.env.example deploy/.env
#   # 编辑 deploy/.env 填入真实凭据
#   cd deploy
#   # 按 Profile 分组启动:
#   docker compose -f docker-compose.services.yml --profile core-trade up -d --build
#   docker compose -f docker-compose.services.yml --profile core-ai-chain up -d --build
#   docker compose -f docker-compose.services.yml --profile light-forum up -d --build
#   docker compose -f docker-compose.services.yml --profile light-edu up -d --build
#   docker compose -f docker-compose.services.yml --profile light-data-supply up -d --build
#   # 或一次性启动全部:
#   docker compose -f docker-compose.services.yml \
#     --profile core-trade \
#     --profile core-ai-chain \
#     --profile light-forum \
#     --profile light-edu \
#     --profile light-data-supply \
#     up -d --build
# ==============================================================================
# 端口规范 (v4.0):
#   网关层: core-gateway=9000, lite-gateway=8081
#   核心业务: admin=8100, user=8101, product=8102, order=8103, payment=8104
#             marketing=8105, ai=8106, copyright=8107, merchant=8110, pattern=8115
#   轻量业务: community=8108, supply=8109, message=8111, academy=8112
#             analytics=8113, message-im=8114
#   业务服务仅容器内部端口，不对外暴露宿主机端口，全部流量经网关转发
# ==============================================================================

version: '3.8'

networks:
  tailoris-services:
    name: tailoris-services
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
  tailor-mid-net:
    name: tailor-mid-net
    external: true
  tailor-core-net:
    name: tailor-core-net
    external: true
  tailor-light-net:
    name: tailor-light-net
    external: true

x-core-service: &core-service
  restart: unless-stopped
  networks:
    - tailor-mid-net
    - tailor-core-net
  env_file:
    - ./tailor-is-prod/env/.env.base
  environment:
    - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_ADDR:-nacos:8848}
    - NACOS_NAMESPACE=dev
    - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/?allowPublicKeyRetrieval=true
    - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME:-root}
    - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
    - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
    - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
    - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
    - SPRING_DATA_REDIS_DATABASE=0
    - SPRING_DATA_MONGODB_HOST=${MONGO_HOST:-mongodb}
    - SPRING_DATA_MONGODB_PORT=${MONGO_PORT:-27017}
    - SPRING_DATA_MONGODB_USERNAME=${MONGO_USERNAME:-admin}
    - SPRING_DATA_MONGODB_PASSWORD=${MONGO_PASSWORD}
    - SPRING_DATA_MONGODB_DATABASE=tailor_is
    - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
    - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
    - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-rabbitmq}
    - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
    - JVM_XMX=320m
    - JVM_XMS=160m
    - JAVA_OPTS=-XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -Xms160m -Xmx320m -XX:MaxMetaspaceSize=128m -XX:-TieredCompilation -XX:ParallelGCThreads=2 -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=60
    - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info
    - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=never
    - SPRING_CLOUD_SENTINEL_ENABLED=false
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: '0.8'
        memory: 512M
      reservations:
        cpus: '0.2'
        memory: 160M

x-light-service: &light-service
  restart: unless-stopped
  networks:
    - tailor-mid-net
    - tailor-light-net
  env_file:
    - ./tailor-is-prod/env/.env.base
  environment:
    - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_ADDR:-nacos:8848}
    - NACOS_NAMESPACE=dev
    - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/?allowPublicKeyRetrieval=true
    - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME:-root}
    - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
    - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
    - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
    - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
    - SPRING_DATA_REDIS_DATABASE=0
    - SPRING_DATA_MONGODB_HOST=${MONGO_HOST:-mongodb}
    - SPRING_DATA_MONGODB_PORT=${MONGO_PORT:-27017}
    - SPRING_DATA_MONGODB_USERNAME=${MONGO_USERNAME:-admin}
    - SPRING_DATA_MONGODB_PASSWORD=${MONGO_PASSWORD}
    - SPRING_DATA_MONGODB_DATABASE=tailor_is
    - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
    - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
    - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-rabbitmq}
    - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
    - JVM_XMX=220m
    - JVM_XMS=128m
    - JAVA_OPTS=-XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -Xms128m -Xmx220m -XX:MaxMetaspaceSize=128m -XX:-TieredCompilation -XX:ParallelGCThreads=2 -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=60
    - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info
    - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=never
    - SPRING_CLOUD_SENTINEL_ENABLED=false
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 384M
      reservations:
        cpus: '0.1'
        memory: 160M

x-healthcheck-default: &healthcheck-default
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 90s

services:

  # ============================================================================
  # 基础设施服务（MySQL / Redis / Nacos / RabbitMQ）
  # 所有业务服务依赖这些基础设施，通过服务名 DNS 解析访问
  # ============================================================================

  mysql:
    image: mysql:8.0
    container_name: tailor-is-mysql
    hostname: mysql
    restart: unless-stopped
    networks:
      - tailor-mid-net
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - ./volumes/mysql/data:/var/lib/mysql
      - ../tailor-is/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: tailor-is-redis
    hostname: redis
    restart: unless-stopped
    networks:
      - tailor-mid-net
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - ./volumes/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.2'
          memory: 128M

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: tailor-is-nacos
    hostname: nacos
    restart: unless-stopped
    networks:
      - tailor-mid-net
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    volumes:
      - ./volumes/nacos/logs:/home/nacos/logs
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 1G
        reservations:
          cpus: '0.4'
          memory: 512M

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tailor-is-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    networks:
      - tailor-mid-net
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-rabbitmq}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - ./volumes/rabbitmq/data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  mongodb:
    image: mongo:7.0
    container_name: tailor-is-mongodb
    hostname: mongodb
    restart: unless-stopped
    networks:
      - tailor-mid-net
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-mongodb}
    volumes:
      - ./volumes/mongodb/data:/data/db
      - ./volumes/mongodb/configdb:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M
        reservations:
          cpus: '0.3'
          memory: 256M

  # ============================================================================
  # Profile: core-trade — 核心交易链路
  # ============================================================================

  core-gateway:
    <<: *core-service
    profiles: ["core-trade"]
    build:
      context: ../tailor-is
      dockerfile: tailor-is-core-gateway/Dockerfile
    image: tailor-is-core-gateway:latest
    container_name: tailor-is-core-gateway
    hostname: core-gateway
    ports:
      - "9000:8080"
    networks:
      - tailor-mid-net
      - tailor-core-net
      - tailor-light-net
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SERVER_PORT=8080
      - NACOS_NAMESPACE=dev
      - SPRING_DATA_REDIS_DATABASE=0
      - JVM_XMX=512m
      - JVM_XMS=256m
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -Xms256m -Xmx512m -XX:MaxMetaspaceSize=128m -XX:-TieredCompilation -XX:ParallelGCThreads=2 -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=60
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  lite-gateway:
    <<: *core-service
    profiles: ["core-trade"]
    build:
      context: ../tailor-is
      dockerfile: tailor-is-lite-gateway/Dockerfile
    image: tailor-is-lite-gateway:latest
    container_name: tailor-is-lite-gateway
    hostname: lite-gateway
    ports:
      - "8081:8081"
    networks:
      - tailor-mid-net
      - tailor-core-net
      - tailor-light-net
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SERVER_PORT=8081
      - JVM_XMX=320m
      - JVM_XMS=160m
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -Xms160m -Xmx320m -XX:MaxMetaspaceSize=128m -XX:-TieredCompilation -XX:ParallelGCThreads=2 -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=60
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  user-service:
    <<: *core-service
    profiles: ["core-trade"]
    build:
      context: ../tailor-is
      dockerfile: tailor-is-user/Dockerfile
    image: tailor-is-user:latest
    container_name: tailor-is-user
    hostname: user-service
    environment:
      - SERVER_PORT=8101
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tailor_is_user?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - SPRING_DATA_REDIS_DATABASE=0
      - TAILORIS_OSS_LOCAL_FALLBACK_PATH=/app/upload
      - JVM_XMX=512m
      - JVM_XMS=256m
    volumes:
      - ./volumes/user-service/upload:/app/upload
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8101/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  product-service:
    <<: *core-service
    profiles: ["core-trade"]
    build:
      context: ../tailor-is
      dockerfile: tailor-is-product/Dockerfile
    image: tailor-is-product:latest
    container_name: tailor-is-product
    hostname: product-service
    environment:
      - SERVER_PORT=8102
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tailor_is_product?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - AES_KEY=${AES_KEY}
      - JVM_XMX=320m
      - JVM_XMS=160m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8102/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  order-service:
    <<: *core-service
    profiles: ["core-trade"]
    build:
      context: ../tailor-is
      dockerfile: tailor-is-order/Dockerfile
    image: tailor-is-order:latest
    container_name: tailor-is-order
    hostname: order-service
    environment:
      - SERVER_PORT=8103
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tailor_is_order?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - JVM_XMX=512m
      - JVM_XMS=256m
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:ActiveProcessorCount=4 -Xms256m -Xmx512m -XX:MaxMetaspaceSize=128m -XX:-TieredCompilation -XX:ParallelGCThreads=4 -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=60
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8103/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  payment-service:
    <<: *core-service
    profiles: ["core-trade"]
    build:
      context: ../tailor-is
      dockerfile: tailor-is-payment/Dockerfile
    image: tailor-is-payment:latest
    container_name: tailor-is-payment
    hostname: payment-service
    environment:
      - SERVER_PORT=8104
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tailor_is_payment?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - JVM_XMX=320m
      - JVM_XMS=160m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8104/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  marketing-service:
    <<: *core-service
    profiles: ["core-trade"]
    build:
      context: ../tailor-is
      dockerfile: tailor-is-marketing/Dockerfile
    image: tailor-is-marketing:latest
    container_name: tailor-is-marketing
    hostname: marketing-service
    environment:
      - SERVER_PORT=8105
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tailor_is_marketing?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - JVM_XMX=320m
      - JVM_XMS=160m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8105/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  merchant-service:
    <<: *core-service
    profiles: ["core-trade"]
    build:
      context: ../tailor-is
      dockerfile: tailor-is-merchant/Dockerfile
    image: tailor-is-merchant:latest
    container_name: tailor-is-merchant
    hostname: merchant-service
    environment:
      - SERVER_PORT=8110
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tailor_is_merchant?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - JVM_XMX=320m
      - JVM_XMS=160m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8110/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  admin-service:
    <<: *core-service
    profiles: ["core-trade"]
    build:
      context: ../tailor-is
      dockerfile: tailor-is-admin/Dockerfile
    image: tailor-is-admin:latest
    container_name: tailor-is-admin
    hostname: admin-service
    environment:
      - SERVER_PORT=8100
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tailor_is_admin?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - JVM_XMX=320m
      - JVM_XMS=160m
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -Xms160m -Xmx320m -XX:MaxMetaspaceSize=128m -XX:-TieredCompilation -XX:ParallelGCThreads=2 -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=60
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8100/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ============================================================================
  # Profile: core-ai-chain — AI 算法 + 区块链版权链
  # ============================================================================

  ai-service:
    <<: *core-service
    profiles: ["core-ai-chain"]
    build:
      context: ../tailor-is
      dockerfile: tailor-is-ai/Dockerfile
    image: tailor-is-ai:latest
    container_name: tailor-is-ai
    hostname: ai-service
    environment:
      - SERVER_PORT=8106
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tailor_is_ai?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - JVM_XMX=512m
      - JVM_XMS=256m
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:ActiveProcessorCount=4 -Xms256m -Xmx512m -XX:MaxMetaspaceSize=128m -XX:-TieredCompilation -XX:ParallelGCThreads=4 -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=60
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8106/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  copyright-service:
    <<: *core-service
    profiles: ["core-ai-chain"]
    build:
      context: ../tailor-is
      dockerfile: tailor-is-copyright/Dockerfile
    image: tailor-is-copyright:latest
    container_name: tailor-is-copyright
    hostname: copyright-service
    environment:
      - SERVER_PORT=8107
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tailor_is_copyright?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - COPYRIGHT_AES_KEY=${COPYRIGHT_AES_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8107/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  pattern-service:
    <<: *light-service
    profiles: ["core-ai-chain"]
    build:
      context: ../tailor-is
      dockerfile: tailor-is-pattern/Dockerfile
    image: tailor-is-pattern:latest
    container_name: tailor-is-pattern
    hostname: pattern-service
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - SERVER_PORT=8115
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tailor_is_pattern?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8115/actuator/health || exit 1"]
