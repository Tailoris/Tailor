# ==============================================================================
# 告警 Webhook 中继 - 接入钉钉/飞书/企业微信/Resend 邮件
# ==============================================================================
  alert-webhook:
    image: tailor-is/alert-webhook:1.0.0
    container_name: tailor-is-alert-webhook
    hostname: alert-webhook
    network_mode: host
    build:
      context: ./alert-webhook
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Shanghai
      PORT: "9095"
      DINGTALK_WEBHOOK: ${DINGTALK_WEBHOOK:-}
      DINGTALK_SECRET:  ${DINGTALK_SECRET:-}
      FEISHU_WEBHOOK:   ${FEISHU_WEBHOOK:-}
      WECOM_WEBHOOK:    ${WECOM_WEBHOOK:-}
      RESEND_API_KEY:   ${RESEND_API_KEY:-}
      ALERT_FROM_EMAIL: ${ALERT_FROM_EMAIL:-"Tailor IS <alerts@tailorbot.top>"}
      ALERT_TO_EMAIL:   ${ALERT_TO_EMAIL:-}
    
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 256M }
        reservations: { cpus: '0.1', memory: 64M }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9095/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# ==============================================================================
# 监控 Exporter 层 (🔒 H-13修复: 合并入主 compose，统一编排)
# ==============================================================================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: tailor-is-node-exporter
    hostname: node-exporter
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.1', memory: 128M }
        reservations: { cpus: '0.05', memory: 32M }

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: tailor-is-mysqld-exporter
    hostname: mysqld-exporter
    network_mode: host
    environment:
      DATA_SOURCE_NAME: "root:${MYSQL_PASSWORD}@tcp(localhost:3306)/"
    volumes:
      - ./my.cnf:/.my.cnf:ro
    command:
      - --config.my-cnf=/.my.cnf
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.1', memory: 128M }
        reservations: { cpus: '0.05', memory: 32M }

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: tailor-is-redis-exporter
    hostname: redis-exporter
    network_mode: host
    environment:
      REDIS_ADDR: "redis://localhost:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.1', memory: 128M }
        reservations: { cpus: '0.05', memory: 32M }

  # nginx-exporter:  # 暂时禁用 - 镜像不可用
  #   image: nginxinc/nginx-prometheus-exporter:1.1.0
  #   container_name: tailor-is-nginx-exporter
  #   hostname: nginx-exporter
  #   network_mode: host
  #   command:
  #     - -nginx.scrape-uri=http://localhost:80/nginx_status
