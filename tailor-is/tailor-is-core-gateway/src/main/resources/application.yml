server:
  port: ${SERVER_PORT:9000}

spring:
  application:
    name: tailor-is-core-gateway
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        register-enabled: true
        fail-fast: false
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        enabled: false
    sentinel:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        enabled: false
      # ============================================================
      # 路由策略: Java Config 硬编码路由（唯一权威来源）
      #
      # 路由定义位于 CoreGatewayRouteConfig.java
      # 禁止在 yml 文件中配置路由规则，CI 静态检测会拦截违规代码
      #
      # v4.0 优化: 所有路由 uri 使用 lb://tailor-is-{service} 服务发现格式
      #           禁止硬编码 http://host:port，支持自动扩缩容和负载均衡
      # ============================================================

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      connect-timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 2000ms

sa-token:
  token-name: Authorization
  timeout: 1800
  active-timeout: 7200
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-redis: true

# ============================================================
# Core Gateway: 核心业务服务路由
# 承载: user, merchant, product, order, payment, marketing, ai, copyright, admin, pattern
# v4.0 优化: community/supply/message/academy/analytics/im 已迁移至 lite-gateway
# ============================================================
tailoris:
  gateway:
    auth:
      excluded-paths: /api/auth/login,/api/auth/register,/api/auth/sms-code,/api/auth/refresh,/api/auth/reset-password,/api/auth/login/code,/api/auth/register/email,/api/auth/email-code,/api/auth/userinfo,/api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/sms-code,/api/v1/auth/email-code,/api/v1/auth/login/code,/api/v1/auth/register/email,/api/v1/auth/refresh,/api/v1/auth/reset-password,/api/v1/auth/wechat-login,/api/v1/auth/userinfo,/api/v1/products/**,/api/v1/product/list,/api/v1/product/search,/api/v1/community/post/**,/api/v1/community/posts/**
    ratelimit:
      enabled: true
      default-permits-per-second: 200
      login-permits-per-minute: 10
      api-paths:
        - /api/auth/login
        - /api/auth/register
        - /api/payment/**
        - /api/v1/auth/login
        - /api/v1/auth/register
        - /api/v1/payment/**

knife4j:
  gateway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: tailor-is-core-gateway

---
spring.config.activate.on-profile: prod
knife4j:
  gateway:
    enabled: false