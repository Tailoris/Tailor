# ==============================================================================
# Tailor IS - Vault 配置
# ==============================================================================
#
# 启用 Vault 替代 K8s Secret 的步骤:
#   1. 部署 Vault: kubectl apply -f vault-deployment.yaml
#   2. 初始化 Vault: kubectl exec -it vault-0 -n tailor-is-prod -- vault operator init
#      记录输出的 5 个 Unseal Key 和 Root Token
#   3. 解封 Vault: kubectl exec -it vault-0 -n tailor-is-prod -- vault operator unseal <key>
#      (需使用 3 个不同的 Unseal Key)
#   4. 登录 Vault: vault login <root-token>
#   5. 启用 KV 引擎: vault secrets enable -path=tailor-is kv-v2
#   6. 写入密钥: vault kv put tailor-is/prod/db username=root password=<password>
#   7. 配置 K8s Auth: 参考 vault-init-job.yaml 创建 ServiceAccount 绑定
#   8. 应用通过 CSI Driver 或 sidecar 注入读取密钥
#   9. 更新 Deployment 移除 K8s Secret 引用，改用 Vault 注解
#
# 注意: Vault 生产环境建议使用 Auto-Unseal（AWS KMS / Azure Key Vault）
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: tailor-is-prod
  labels:
    app: tailor-is
    component: vault
    environment: production
data:
  vault-config.hcl: |
    ui = true
    disable_mlock = false

    api_addr = "http://vault.tailor-is-prod.svc.cluster.local:8200"
    cluster_addr = "http://vault-internal.tailor-is-prod.svc.cluster.local:8201"

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = "true"
    }

    storage "file" {
      path = "/vault/data"
    }

    telemetry {
      prometheus_retention_time = "30s"
      disable_hostname = true
    }

    # Seal 配置 (可选: 使用 AWS KMS / Azure Key Vault / GCP KMS 自动解封)
    # seal "awskms" {
    #   region     = "us-east-1"
    #   kms_key_id = "alias/tailor-is-vault"
    # }

    max_lease_ttl = "768h"
    default_lease_ttl = "168h"

    log_level = "info"