groups:
  - name: cpu_alerts
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "整机CPU使用率超过70%"
          description: "当前CPU使用率: {{ $value | humanize }}%"

      - alert: CriticalCPUUsage
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "整机CPU使用率超过85%（严重）"
          description: "当前CPU使用率: {{ $value | humanize }}%，请立即检查！"

      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{name=~"tailor-is-.*"}[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "容器 {{ $labels.name }} CPU使用率过高"
          description: "容器 {{ $labels.name }} 的CPU使用率持续超过0.5核"

  - name: jvm_alerts
    interval: 30s
    rules:
      - alert: HighJVMGC
        expr: rate(jvm_gc_pause_seconds_sum[5m]) / rate(jvm_gc_pause_seconds_count[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM GC暂停时间过长"
          description: "服务 {{ $labels.application }} 的平均GC暂停时间超过100ms"

      - alert: HighJVMHeapUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM堆内存使用率超过85%"
          description: "服务 {{ $labels.application }} 堆内存使用率: {{ $value | humanizePercentage }}"

  - name: service_alerts
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job="tailor-is-services"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "服务 {{ $labels.instance }} 已下线"
          description: "服务 {{ $labels.instance }} 超过2分钟不可达"