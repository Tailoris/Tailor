# ==============================================================================
# Tailor IS - Nginx Docker Compose (替代系统原生 Nginx)
# ==============================================================================
# 使用方式:
#   cd deploy
#   docker compose -f docker-compose.nginx.yml --profile infra up -d
# ==============================================================================

version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: tailor-is-nginx
    profiles: ["infra"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/frontend-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/rate-limiting.conf:/etc/nginx/rate-limiting.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./tailor-is-prod/frontend/pc-mall:/usr/share/nginx/html/pc-mall:ro
      - ./tailor-is-prod/frontend/merchant-admin:/usr/share/nginx/html/merchant-admin:ro
      - ./tailor-is-prod/frontend/platform-admin:/usr/share/nginx/html/platform-admin:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - tailor-mid-net
      - tailor-core-net
      - tailor-light-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  tailor-mid-net:
    external: true
  tailor-core-net:
    external: true
  tailor-light-net:
    external: true