# ==============================================================================
# Tailor IS - Redis Sentinel 1 配置
# Phase 3 P3-1: Redis Sentinel 高可用
# ==============================================================================

# Sentinel 端口
port 26379
bind 0.0.0.0
protected-mode no

# Redis 8.x 需要显式启用主机名解析
sentinel resolve-hostnames yes

# 监控 Master (quorum = 2 表示至少 2 个 Sentinel 同意才触发故障转移)
sentinel monitor tailor-is-master redis-master 6379 2
# 密码通过环境变量 ${REDIS_PASSWORD} 注入，默认值仅用于开发环境
# 生产环境务必通过 .env 文件或 CI/CD 变量设置 REDIS_PASSWORD
sentinel auth-pass tailor-is-master ${REDIS_PASSWORD}

# 故障转移配置
sentinel down-after-milliseconds tailor-is-master 5000
sentinel parallel-syncs tailor-is-master 1
sentinel failover-timeout tailor-is-master 30000

# 日志
logfile ""
dir /tmp

sentinel deny-scripts-reconfig yes