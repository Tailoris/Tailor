  #       reservations: { cpus: '0.05', memory: 16M }

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: tailor-is-blackbox-exporter
    hostname: blackbox-exporter
    network_mode: host
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.1', memory: 64M }
        reservations: { cpus: '0.05', memory: 16M }

# ==============================================================================
# 前端静态资源服务 (Frontend)
# ==============================================================================
  nginx-frontend:
    image: nginx:1.27-alpine
    container_name: tailor-is-frontend
    hostname: frontend
    network_mode: host
    volumes:
      - ../tailor-is-frontend/pc-mall/dist:/usr/share/nginx/html/pc-mall:ro
      - ../tailor-is-frontend/merchant-admin/dist:/usr/share/nginx/html/merchant-admin:ro
      - ../tailor-is-frontend/platform-admin/dist:/usr/share/nginx/html/platform-admin:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/rate-limiting.conf:/etc/nginx/rate-limiting.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    <<: *restart-policy
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
