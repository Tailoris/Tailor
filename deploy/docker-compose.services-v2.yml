      - SERVER_PORT=8101
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/tailor_is_user?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai
