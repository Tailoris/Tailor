# ==============================================================================
# Tailor IS - Nacos 服务注册中心 & 配置中心
# ==============================================================================
# 版本: Nacos 2.3.x
# 部署模式: 3 节点集群 (高可用)
# 端口: 8848 (HTTP), 9848 (gRPC), 9849 (gRPC for cluster)
#
# 使用说明:
#   1. 需要先创建 MySQL 数据库 (nacos_config) 并导入初始化脚本
#   2. 配置 Nacos 认证密钥 (NACOS_AUTH_TOKEN)
#   3. 生产环境建议使用外部 MySQL 8.0+
#
# 启动前准备:
#   - MySQL 中创建 nacos_config 数据库
#   - 执行 Nacos 官方初始化 SQL: https://github.com/alibaba/nacos/blob/master/distribution/conf/mysql-schema.sql
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: tailor-is-prod
  labels:
    app: nacos
    app.kubernetes.io/name: nacos
    app.kubernetes.io/part-of: tailor-is
spec:
  type: ClusterIP
  clusterIP: None  # Headless Service for StatefulSet
  ports:
    - name: http
      port: 8848
      targetPort: 8848
      protocol: TCP
    - name: grpc
      port: 9848
      targetPort: 9848
      protocol: TCP
    - name: grpc-cluster
      port: 9849
      targetPort: 9849
      protocol: TCP
  selector:
    app: nacos

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nacos
  namespace: tailor-is-prod
  labels:
    app: nacos
    app.kubernetes.io/name: nacos
    app.kubernetes.io/component: infrastructure
    app.kubernetes.io/part-of: tailor-is
spec:
  serviceName: nacos
  replicas: 3
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
        app.kubernetes.io/name: nacos
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/nacos/actuator/prometheus"
        prometheus.io/port: "8848"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - nacos
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.3.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8848
              protocol: TCP
            - name: grpc
              containerPort: 9848
              protocol: TCP
            - name: grpc-cluster
              containerPort: 9849
              protocol: TCP
          env:
            - name: MODE
              value: "cluster"
            - name: PREFER_HOST_MODE
              value: "hostname"
            - name: NACOS_SERVERS
              value: "nacos-0.nacos.tailor-is-prod.svc.cluster.local:8848 nacos-1.nacos.tailor-is-prod.svc.cluster.local:8848 nacos-2.nacos.tailor-is-prod.svc.cluster.local:8848"
            - name: SPRING_DATASOURCE_PLATFORM
              value: "mysql"
            - name: MYSQL_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: tailor-is-config
                  key: MYSQL_HOST
            - name: MYSQL_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: tailor-is-config
                  key: MYSQL_PORT
            - name: MYSQL_SERVICE_DB_NAME
              value: "nacos_config"
            - name: MYSQL_SERVICE_USER
              valueFrom:
                secretKeyRef:
                  name: tailor-is-secret
                  key: mysql-username
            - name: MYSQL_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tailor-is-secret
                  key: mysql-password
            - name: NACOS_AUTH_ENABLE
              value: "true"
            - name: NACOS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tailor-is-secret
                  key: nacos-auth-token
            - name: NACOS_AUTH_IDENTITY_KEY
              value: "serverIdentity"
            - name: NACOS_AUTH_IDENTITY_VALUE
              valueFrom:
                secretKeyRef:
                  name: tailor-is-secret
                  key: nacos-identity-value
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /nacos/actuator/health/liveness
              port: 8848
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /nacos/actuator/health/readiness
              port: 8848
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /nacos/actuator/health/liveness
              port: 8848
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: nacos-data
              mountPath: /home/nacos/data
            - name: nacos-logs
              mountPath: /home/nacos/logs
  volumeClaimTemplates:
    - metadata:
        name: nacos-data
        labels:
          app: nacos
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: tailor-is-storage
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: nacos-logs
        labels:
          app: nacos
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: tailor-is-storage
        resources:
          requests:
            storage: 10Gi