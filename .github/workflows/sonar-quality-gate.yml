name: SonarQube Code Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 每周一次全面扫描
    - cron: '0 2 * * 1'

jobs:
  sonar:
    name: SonarQube 质量扫描
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 缓存 SonarQube 包
        uses: actions/cache@v4
        with:
          path: ~/.sonar
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: 编译并执行测试
        working-directory: tailor-is
        run: |
          mvn clean test \
            -DskipITs=false \
            -Dmaven.test.failure.ignore=true \
            -Dspring.profiles.active=test

      - name: SonarQube 扫描
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=tailor-is \
            -Dsonar.projectName='Tailor IS Backend' \
            -Dsonar.projectVersion=${GITHUB_REF#refs/heads/} \
            -Dsonar.sources=. \
            -Dsonar.tests=src/test \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.junit.reportPaths=target/surefire-reports \
            -Dsonar.jacoco.reportPaths=target/jacoco.exec \
            -Dsonar.exclusions=\
              **/target/**,\
              **/generated/**,\
              **/entity/**,\
              **/dto/**,\
              **/*Application.java,\
              **/config/**,\
              **/*Mapper.java,\
              **/*Builder.java

      - name: 检查质量门禁
        if: always()
        run: |
          echo "质量门禁由 SonarQube 服务器端配置"
          echo "Quality Gate: 必须通过"
          echo "配置文件: sonar-project.properties"
          echo "详细规则见: docs/code-review-guide.md"

      - name: 上传分析结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          path: tailor-is/target/sonar/
          retention-days: 30
