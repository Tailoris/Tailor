spring:
  application:
    name: tailor-is-pattern
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        file-extension: yaml
        group: DEFAULT_GROUP
        shared-configs:
          - data-id: tailor-is-common.yml
            group: DEFAULT_GROUP
            refresh: true
