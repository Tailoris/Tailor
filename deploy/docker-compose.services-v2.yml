# ==============================================================================
# Tailor IS - Docker Compose 核心微服务编排 v2.0 (CPU优化版)
# ==============================================================================
# 基于 docker-compose.services.yml 优化，统一整合 prod compose 的资源策略
# 关键优化:
#   1. 全部服务注入 JVM 容器感知参数 (UseContainerSupport + ActiveProcessorCount=2)
#   2. 使用 G1GC 替代 Parallel GC，减少 Full GC CPU 消耗
#   3. CPU/内存限额按服务分级 (核心/普通/轻量)
#   4. Profile 分组启动，按需运行，避免全量启动
# ==============================================================================
# 使用方式:
#   cd deploy
#   # 按 Profile 分组启动:
#   docker compose -f docker-compose.services-v2.yml --profile core-trade up -d --build
#   docker compose -f docker-compose.services-v2.yml --profile core-ai-chain up -d --build
#   docker compose -f docker-compose.services-v2.yml --profile light-forum up -d --build
#   docker compose -f docker-compose.services-v2.yml --profile light-edu up -d --build
#   docker compose -f docker-compose.services-v2.yml --profile light-data-supply up -d --build
# ==============================================================================

version: '3.8'

networks:
  tailoris-services:
    name: tailoris-services
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

x-core-service: &core-service
  restart: unless-stopped
  networks:
    - tailoris-services
  extra_hosts:
    - "host.docker.internal:host-gateway"
  init: true
  stop_grace_period: 30s
  env_file:
    - ./tailor-is-prod/env/.env.base
    - ./tailor-is-prod/env/.env.core
    - ./tailor-is-prod/env/.env.dev
  environment:
    - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_ADDR:-host.docker.internal:8848}
    - NACOS_NAMESPACE=dev
    - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/
    - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME:-root}
    - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
    - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-host.docker.internal}
    - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
    - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
    - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST:-host.docker.internal}
    - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
    - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-rabbitmq}
    - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
    - JVM_XMX=320m
    - JVM_XMS=160m
    - JAVA_OPTS=-XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=45 -XX:G1ReservePercent=10 -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1 -Xms160m -Xmx320m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=40 -Dserver.tomcat.threads.min-spare=5 -Dserver.tomcat.max-connections=200 -Dserver.tomcat.accept-count=50
    - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus
    - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=never
    - SPRING_CLOUD_SENTINEL_ENABLED=false
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: '0.30'
        memory: 512M
      reservations:
        cpus: '0.10'
        memory: 128M

x-light-service: &light-service
  restart: unless-stopped
  networks:
    - tailoris-services
  extra_hosts:
    - "host.docker.internal:host-gateway"
  init: true
  stop_grace_period: 30s
  env_file:
    - ./tailor-is-prod/env/.env.base
    - ./tailor-is-prod/env/.env.light
    - ./tailor-is-prod/env/.env.dev
  environment:
    - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=${NACOS_ADDR:-host.docker.internal:8848}
    - NACOS_NAMESPACE=dev
    - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/
    - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME:-root}
    - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
    - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-host.docker.internal}
    - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
    - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
    - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST:-host.docker.internal}
    - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
    - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-rabbitmq}
    - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
    - JVM_XMX=220m
    - JVM_XMS=128m
    - JAVA_OPTS=-XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=45 -XX:G1ReservePercent=10 -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1 -Xms128m -Xmx220m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=40 -Dserver.tomcat.threads.min-spare=5 -Dserver.tomcat.max-connections=200 -Dserver.tomcat.accept-count=50
    - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus
    - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=never
    - SPRING_CLOUD_SENTINEL_ENABLED=false
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        cpus: '0.20'
        memory: 384M
      reservations:
        cpus: '0.05'
        memory: 128M

services:

  # ============================================================================
  # Profile: core-trade — 核心交易链路（7个服务）
  # 预期总CPU: 7 × 0.30 = 2.1核
  # ============================================================================

  core-gateway:
    <<: *core-service
    profiles: ["core-trade"]
    build:
      context: ../tailor-is
      dockerfile: tailor-is-core-gateway/Dockerfile
    image: tailor-is-core-gateway:latest
    container_name: tailor-is-core-gateway
    hostname: core-gateway
    ports:
      - "9000:8080"
    environment:
      - SERVER_PORT=8080
      - NACOS_NAMESPACE=dev
      - SPRING_DATA_REDIS_DATABASE=1
      - JVM_XMX=512m
      - JVM_XMS=256m
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=45 -XX:G1ReservePercent=10 -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1 -Xms256m -Xmx512m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=60 -Dserver.tomcat.threads.min-spare=10 -Dserver.tomcat.max-connections=500 -Dserver.tomcat.accept-count=100
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 1024M }
        reservations: { cpus: '0.15', memory: 256M }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  lite-gateway:
    <<: *core-service
    profiles: ["core-trade"]
    build:
      context: ../tailor-is
      dockerfile: tailor-is-lite-gateway/Dockerfile
