# =====================================================================
# Tailor IS SonarQube 项目配置
# 对应: H-02 (无 SonarQube 静态分析) + P1-1
# 参考: tailor-is/docs/SONARQUBE-GUIDE.md
#
# SonarQube Server 部署说明:
#   1. Docker 部署 (推荐):
#      docker run -d --name sonarqube -p 9000:9000 \
#        -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
#        sonarqube:10.5-community
#   2. 访问 http://localhost:9000，默认账号 admin/admin
#   3. 创建项目: Administration → Projects → Create Project → tailor-is
#   4. 生成 Token: My Account → Security → Generate Token
#   5. 在 CI 中配置 SONAR_TOKEN 和 SONAR_HOST_URL 环境变量
#   6. 质量门禁: 在 Web UI → Quality Gates 创建 tailor-is-quality-gate
#   7. 运行扫描:
#      mvn sonar:sonar \
#        -Dsonar.host.url=http://sonarqube:9000 \
#        -Dsonar.token=<your-token>
# =====================================================================

sonar.projectKey=tailor-is
sonar.projectName=Tailor IS Platform
sonar.projectVersion=1.0.0

# 组织与版权
sonar.organization=tailoris
sonar.links.homepage=https://tailoris.example.com
sonar.links.scm=https://github.com/tailoris/tailor-is
sonar.links.issue=https://github.com/tailoris/tailor-is/issues

# ----------------- 源码与测试 -----------------
sonar.sources=tailor-is-common/src,\
             tailor-is-common-web/src,\
             tailor-is-api/src,\
             tailor-is-core-gateway/src,\
             tailor-is-lite-gateway/src,\
             tailor-is-user/src,\
             tailor-is-merchant/src,\
             tailor-is-product/src,\
             tailor-is-order/src,\
             tailor-is-payment/src,\
             tailor-is-marketing/src,\
             tailor-is-ai/src,\
             tailor-is-copyright/src,\
             tailor-is-community/src,\
             tailor-is-supply/src,\
             tailor-is-message/src,\
             tailor-is-message-im/src,\
             tailor-is-academy/src,\
             tailor-is-analytics/src,\
             tailor-is-pattern/src,\
             tailor-is-admin/src

sonar.tests=**/src/test/java
sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/test/**/*Test.java,**/test/**/*Tests.java
sonar.test.exclusions=**/it/**,**/*IT.java

# ----------------- 排除项 -----------------
# 排除生成代码、依赖、目标产物、测试工具类、迁移期空模块
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/build/**,\
                 **/*.jar,**/*.war,**/*.class,\
                 **/generated/**,**/Generated*.java,\
                 **/assembly/**,**/site/**,**/surefire-reports/**,\
                 **/tailor-is-common-web/src/**,\
                 **/tailor-is-analytics/src/**,\
                 **/tailor-is-pattern/src/**,\
                 **/tailor-is-supply/src/**,\
                 **/tailor-is-message/src/**,\
                 **/tailor-is-message-im/src/**,\
                 **/tailor-is-academy/src/**,\
                 **/tailor-is-copyright/src/**,\
                 **/tailwind.config.js,\
                 **/src/test/java/**/util/**,\
                 **/src/test/java/**/helper/**,\
                 **/src/test/java/**/mock/**

# 排除重复代码检查
sonar.cpd.exclusions=**/tailor-is-common/src/main/java/com/tailoris/common/util/**,\
                     **/tailor-is-api/src/main/java/**/dto/**,**/vo/**

# ----------------- 语言与编码 -----------------
sonar.sourceEncoding=UTF-8
sonar.language=java

# ----------------- JaCoCo 覆盖率报告 -----------------
# 假定 JaCoCo 报告输出至: tailor-is/target/site/jacoco/jacoco.xml
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# 覆盖率目标
sonar.coverage.minimum=0.0
sonar.junit.reportPaths=**/target/surefire-reports

# ----------------- Java 编译设置 -----------------
sonar.java.source=17
sonar.java.target=17
sonar.java.jdkHome=${env.JAVA_HOME}

# ----------------- 质量门禁(对应 5.2 节) -----------------
# 详见: docs/SONARQUBE-GUIDE.md
#   - 覆盖率 ≥ 60% (Phase 1 目标)
#   - 重复率 ≤ 3%
#   - 阻断问题 = 0
#   - 严重问题 ≤ 5
#   - 新增代码异味 = 0
#   - 代码复杂度 < 15
#   - 圈复杂度 < 20
#
# 注: 质量门禁(Quality Gate)需在 SonarQube Web UI 创建,
#     并在 CI 中通过 API 关联项目。本文件仅控制扫描参数。

# 等待质量门禁结果 (阻塞 CI 直到 SonarQube 返回结果)
sonar.qualitygate.wait=true

# ----------------- 代码复杂度阈值 -----------------
# 最大函数复杂度
sonar.java.squid.maxCyclomaticComplexity=15
# 最大圈复杂度
sonar.java.squid.maxNPathComplexity=200
# 最大认知复杂度
sonar.java.squid.maxCognitiveComplexity=15

# ----------------- 重复代码容忍度 -----------------
# 最小重复代码块大小(行)
sonar.cpd.minimumLines=10
# 最小重复代码块大小(字符)
sonar.cpd.minimumTokens=100

# ----------------- 代码风格标准 -----------------
# 使用自定义 Checkstyle 规则
sonar.java.checkstyle.configPath=tailor-is-common/src/main/resources/checkstyle/checkstyle.xml

# ----------------- 安全规则 -----------------
# 启用 OWASP 安全规则集
sonar.java.security.owaspTop10=true

# ----------------- 新增代码质量门槛 -----------------
# 新增代码覆盖率
sonar.newCoverage.minimum=60
# 新增代码重复率
sonar.newDuplications.maximum=3
# 新增代码复杂度
sonar.newComplexity.maximum=15
# 新增代码异味数
sonar.newSmells.maximum=0
# 新增代码Bug数
sonar.newBugs.maximum=0
# 新增代码漏洞数
sonar.newVulnerabilities.maximum=0

# Checkstyle 报告路径 (maven-checkstyle-plugin 输出)
sonar.java.checkstyle.reportPaths=**/target/checkstyle-result.xml

# PMD 报告路径 (maven-pmd-plugin 输出)
sonar.java.pmd.reportPaths=**/target/pmd.xml

# ----------------- 增量分析(PR 分析) -----------------
sonar.pullrequest.provider=GitHub
sonar.pullrequest.github.repository=tailoris/tailor-is
sonar.pullrequest.base=main

# ----------------- 性能 -----------------
# 启用 SCM 感知但跳过 blame 加速
sonar.scm.disabled=false
sonar.scm.provider=git

# ----------------- 报告与诊断 -----------------
sonar.verbose=false
sonar.log.level=INFO
sonar.scanner.dumpToFile=sonar-scanner-dump.txt
