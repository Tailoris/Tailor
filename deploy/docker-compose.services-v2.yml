    container_name: tailor-is-lite-gateway
    hostname: lite-gateway
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - JVM_XMX=320m
      - JVM_XMS=160m
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=45 -XX:G1ReservePercent=10 -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1 -Xms160m -Xmx320m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64M -Dserver.tomcat.threads.max=40 -Dserver.tomcat.threads.min-spare=5 -Dserver.tomcat.max-connections=200 -Dserver.tomcat.accept-count=50
    deploy:
      resources:
        limits: { cpus: '0.30', memory: 512M }
        reservations: { cpus: '0.10', memory: 128M }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/actuator/health || exit 1"]
