# Prometheus Configuration for Tailor IS
# Generated: 2026-06-03

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'tailor-is-monitor'
    env: 'production'

rule_files:
  - "alerts.yml"

# Alertmanager 集成
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']
          labels:
            alertmanager: 'tailor-is-alertmanager'
      scheme: http
      timeout: 10s
      path_prefix: /

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          env: 'production'

  - job_name: 'tailor-is-microservices'
    metrics_path: '/actuator/prometheus'
    scheme: 'http'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:9000']
        labels: {service: 'tailor-is-core-gateway', port: '9000', env: 'production'}
      - targets: ['localhost:9001']
        labels: {service: 'tailor-is-lite-gateway', port: '9001', env: 'production'}
      - targets: ['localhost:8080']
        labels: {service: 'tailor-is-user',       port: '8080', env: 'production'}
      - targets: ['localhost:8082']
        labels: {service: 'tailor-is-admin',      port: '8082', env: 'production'}
      - targets: ['localhost:8083']
        labels: {service: 'tailor-is-merchant',   port: '8083', env: 'production'}
      - targets: ['localhost:8085']
        labels: {service: 'tailor-is-copyright',  port: '8085', env: 'production'}
      - targets: ['localhost:8090']
        labels: {service: 'tailor-is-product',    port: '8090', env: 'production'}
      - targets: ['localhost:8091']
        labels: {service: 'tailor-is-pattern',    port: '8091', env: 'production'}
      - targets: ['localhost:8100']
        labels: {service: 'tailor-is-supply',     port: '8100', env: 'production'}
      - targets: ['localhost:8110']
        labels: {service: 'tailor-is-order',      port: '8110', env: 'production'}
      - targets: ['localhost:8111']
        labels: {service: 'tailor-is-payment',    port: '8111', env: 'production'}
      - targets: ['localhost:8112']
        labels: {service: 'tailor-is-marketing',  port: '8112', env: 'production'}
      - targets: ['localhost:8113']
        labels: {service: 'tailor-is-message',    port: '8113', env: 'production'}
      - targets: ['localhost:8120']
        labels: {service: 'tailor-is-analytics',  port: '8120', env: 'production'}
      - targets: ['localhost:8130']
        labels: {service: 'tailor-is-community',  port: '8130', env: 'production'}
      - targets: ['localhost:8135']
        labels: {service: 'tailor-is-academy',    port: '8135', env: 'production'}
      - targets: ['localhost:8140']
        labels: {service: 'tailor-is-ai',         port: '8140', env: 'production'}
