# =============================================================
# Nginx HTTPS 特有配置 (🔒 L-07修复: 去除与 default.conf 的重复定义)
# =============================================================
# 说明:
#   - 本文件仅保留 HTTPS 特有配置（SSL 证书、协议、OCSP、HSTS、HTTPS 重定向等）
#   - 通用配置（location /、proxy_pass、安全头、静态资源缓存等）统一在 default.conf 中定义
#   - 安全响应头通过 include /etc/nginx/security-headers.conf 引入，避免重复定义
#   - SSL 证书路径（容器内）：/etc/nginx/ssl/
#   - 宿主路径：/home/tailor/Tailoris/deploy/nginx/ssl/
# =============================================================

# ---------- HTTP 强制跳转（80 → 443）----------
# 将所有 HTTP 请求永久重定向到 HTTPS
server {
    # 监听 IPv4 80 端口
    listen 80;
    # 监听 IPv6 80 端口
    listen [::]:80;

    # 匹配所有主机名
    server_name _;

    # 访问日志
    access_log /var/log/nginx/http-access.log;
    error_log  /var/log/nginx/http-error.log warn;

    # 301 永久重定向到 HTTPS，保留请求路径与参数
    return 301 https://$host$request_uri;
}

# ---------- HTTPS 服务块（443）----------
# 注意: location / proxy_pass 等通用路由配置请参见 default.conf
server {
    # 监听 443 端口，启用 SSL 与 HTTP/2（IPv4）
    listen 443 ssl http2;
    # 监听 443 端口，启用 SSL 与 HTTP/2（IPv6）
    listen [::]:443 ssl http2;

    # 匹配所有主机名，如需指定域名可改为 example.com www.example.com
    server_name _;

    # ---------- 日志配置 ----------
    # HTTPS 访问日志（独立记录，便于审计与分析）
    access_log /var/log/nginx/https-access.log;
    # HTTPS 错误日志，级别为 warn（仅记录警告及以上）
    error_log  /var/log/nginx/https-error.log warn;

    # ---------- SSL 证书（RSA + ECDSA 双证书配置）----------
    # RSA 证书：主流客户端兼容首选
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # ECDSA 证书：性能更好、体积更小，兼容的客户端会优先使用
    ssl_certificate     /etc/nginx/ssl/ec.crt;
    ssl_certificate_key /etc/nginx/ssl/ec.key;

    # ---------- SSL 协议与密码套件 ----------
    # 仅启用 TLSv1.2 与 TLSv1.3，禁用已被破解的 SSLv3 / TLSv1.0 / TLSv1.1
    ssl_protocols TLSv1.2 TLSv1.3;

    # 优先使用服务端指定的密码套件顺序，而非客户端顺序
    ssl_prefer_server_ciphers on;

    # 高安全性密码套件（仅保留前向安全 PFS 的 ECDHE 套件）
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # ---------- Diffie-Hellman 参数 ----------
    # 自定义 DH 参数（建议 2048 位以上），提升 DHE 套件的密钥交换安全性
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # ---------- SSL 会话缓存 ----------
    # 共享内存会话缓存：10MB 约可缓存 40000 个会话
    ssl_session_cache shared:SSL:10m;
    # 会话有效期：10 分钟
    ssl_session_timeout 10m;
    # 关闭会话票证（session tickets），避免前向安全被绕过
    ssl_session_tickets off;

    # ---------- OCSP Stapling ----------
    # 开启 OCSP 装订：由服务器代替客户端去 CA 查询证书吊销状态，减少握手延迟
    ssl_stapling on;
    # 开启 OCSP 响应验证，确保装订的响应合法
    ssl_stapling_verify on;

    # ---------- DNS 解析器（OCSP Stapling 必需）----------
    # 使用 Google + Cloudflare DNS，结果缓存 300 秒
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    # 解析超时 5 秒
    resolver_timeout 5s;

    # ---------- 性能优化 ----------
    # HTTP 长连接超时：75 秒，减少重复握手开销
    keepalive_timeout 75;
    # SSL 记录缓冲区：4k，平衡延迟与吞吐量
    ssl_buffer_size 4k;

    # ---------- 安全响应头（通过 include 引入，避免与 default.conf 重复定义）----------
    # 🔒 L-07修复: 安全头统一由 security-headers.conf 提供，不再在此内联重复定义
    include /etc/nginx/security-headers.conf;
}
