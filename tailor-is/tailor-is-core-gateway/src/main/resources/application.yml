server:
  port: 9000

spring:
  application:
    name: tailor-is-core-gateway
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    sentinel:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        enabled: false
      # ============================================================
      # 路由策略: 双模路由（Nacos 动态路由 + Java Config 硬编码兜底）
      #
      # 当前阶段: 路由权威定义位于 CoreGatewayRouteConfig (Java Config)
      # 后续迁移: 在 Nacos 中创建 data-id=gateway-routes.yaml 的动态路由配置
      #           当 Nacos 可用时优先使用动态路由，不可用时回退到硬编码路由
      #
      # Nacos 动态路由配置示例 (gateway-routes.yaml):
      #   spring:
      #     cloud:
      #       gateway:
      #         routes:
      #           - id: user-route
      #             uri: lb://tailor-is-user
      #             predicates:
      #               - Path=/api/user/**,/api/auth/**
      #             filters:
      #               - StripPrefix=0
      #           - id: product-route
      #             uri: lb://tailor-is-product
      #             predicates:
      #               - Path=/api/product/**,/api/favorite/**
      #             filters:
      #               - StripPrefix=0
      # ============================================================

  data:
    redis:
      # 凭证从环境变量读取 (source deploy/load-credentials.sh)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      connect-timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 2000ms

sa-token:
  token-name: Authorization
  timeout: 1800
  active-timeout: 7200
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-redis: true

# ============================================================
# Core Gateway: 核心业务服务路由 (user, merchant, product, order, payment, marketing, ai, copyright, admin, pattern)
# ============================================================
tailoris:
  gateway:
    auth:
      excluded-paths: /api/auth/login,/api/auth/register,/api/auth/sms-code,/api/auth/refresh,/api/auth/reset-password,/api/auth/login/code,/api/auth/register/email,/api/auth/email-code,/api/auth/userinfo
    ratelimit:
      enabled: true
      default-permits-per-second: 200   # 核心网关: 200 req/s per IP (高于 lite)
      login-permits-per-minute: 10      # 登录接口 10 req/min per IP
      api-paths:
        - /api/auth/login
        - /api/auth/register
        - /api/payment/**

knife4j:
  gateway:
    enabled: false

# 暴露 actuator 端点用于监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: tailor-is-core-gateway

# 日志级别由 logback-spring.xml 统一管理

---
spring.config.activate.on-profile: prod
knife4j:
  gateway:
    enabled: false
