# ==============================================================================
# Tailor IS - Kubernetes Secrets 模板文件
# ==============================================================================
# 此文件为 Secret 模板，所有敏感值使用环境变量引用。
# 实际部署时由 CI/CD 系统注入真实值，切勿直接提交明文密码。
#
# 使用方式:
#   1. 在 CI/CD (GitHub Actions / GitLab CI) 中配置环境变量
#   2. 使用 envsubst 替换占位符: envsubst < secrets-template.yaml | kubectl apply -f -
#   3. 或使用 deploy/scripts/deploy-secrets.sh 脚本部署
#
# 环境变量说明:
#   所有变量值需为原始明文（非 base64），脚本会自动编码。
#   如需手动生成 base64 值: echo -n "real_value" | base64
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: tailor-is-secrets
  namespace: tailor-is-prod
  labels:
    app: tailor-is
    component: secrets
    environment: production
type: Opaque
data:
  # ==========================================================================
  # MySQL 数据库
  # ==========================================================================
  mysql-root-password: ${MYSQL_ROOT_PASSWORD_BASE64}
  mysql-username: ${MYSQL_USERNAME_BASE64}
  mysql-password: ${MYSQL_PASSWORD_BASE64}

  # ==========================================================================
  # Redis 缓存
  # ==========================================================================
  redis-password: ${REDIS_PASSWORD_BASE64}

  # ==========================================================================
  # RabbitMQ 消息队列
  # ==========================================================================
  rabbitmq-username: ${RABBITMQ_USERNAME_BASE64}
  rabbitmq-password: ${RABBITMQ_PASSWORD_BASE64}
  rabbitmq-erlang-cookie: ${RABBITMQ_ERLANG_COOKIE_BASE64}

  # ==========================================================================
  # Nacos 服务注册/配置中心
  # ==========================================================================
  nacos-auth-token: ${NACOS_AUTH_TOKEN_BASE64}
  nacos-auth-identity-value: ${NACOS_AUTH_IDENTITY_VALUE_BASE64}

  # ==========================================================================
  # 网关 HMAC 签名密钥
  # ==========================================================================
  gateway-hmac-secret: ${GATEWAY_HMAC_SECRET_BASE64}

  # ==========================================================================
  # JWT / AES 加密密钥
  # ==========================================================================
  jwt-secret: ${JWT_SECRET_BASE64}
  aes-key: ${AES_KEY_BASE64}

  # ==========================================================================
  # AI 服务 API Key
  # ==========================================================================
  ai-api-key: ${AI_API_KEY_BASE64}
  ai-model-endpoint: ${AI_MODEL_ENDPOINT_BASE64}

  # ==========================================================================
  # 微信支付
  # ==========================================================================
  wechat-pay-app-id: ${WECHAT_PAY_APP_ID_BASE64}
  wechat-pay-mch-id: ${WECHAT_PAY_MCH_ID_BASE64}
  wechat-pay-api-key: ${WECHAT_PAY_API_KEY_BASE64}
  wechat-pay-api-v3-key: ${WECHAT_PAY_API_V3_KEY_BASE64}

  # ==========================================================================
  # 支付宝
  # ==========================================================================
  alipay-app-id: ${ALIPAY_APP_ID_BASE64}
  alipay-private-key: ${ALIPAY_PRIVATE_KEY_BASE64}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY_BASE64}

  # ==========================================================================
  # 区块链服务 (版权存证)
  # ==========================================================================
  blockchain-api-key: ${BLOCKCHAIN_API_KEY_BASE64}
  blockchain-endpoint: ${BLOCKCHAIN_ENDPOINT_BASE64}

  # ==========================================================================
  # 对象存储 OSS
  # ==========================================================================
  oss-access-key-id: ${OSS_ACCESS_KEY_ID_BASE64}
  oss-access-key-secret: ${OSS_ACCESS_KEY_SECRET_BASE64}

  # ==========================================================================
  # 邮件服务 SMTP
  # ==========================================================================
  smtp-username: ${SMTP_USERNAME_BASE64}
  smtp-password: ${SMTP_PASSWORD_BASE64}

  # ==========================================================================
  # 告警通知 Webhook
  # ==========================================================================
  dingtalk-webhook: ${DINGTALK_WEBHOOK_BASE64}
  dingtalk-secret: ${DINGTALK_SECRET_BASE64}
  feishu-webhook: ${FEISHU_WEBHOOK_BASE64}
  wecom-webhook: ${WECOM_WEBHOOK_BASE64}

  # ==========================================================================
  # Grafana 管理员密码
  # ==========================================================================
  grafana-password: ${GRAFANA_PASSWORD_BASE64}