# ============================================================
# Tailor IS - 监控运维服务 (Prometheus + Grafana + AlertManager)
# 文件: docker-compose.monitoring.yml
# 版本: 1.0.0
# 端口: 9200-9299 (v4.0 规范)
# 网络: tailoris-services (复用)
# ============================================================
# 使用方式:
#   docker compose -f docker-compose.services.yml -f docker-compose.monitoring.yml up -d
# ============================================================

services:
  # ============================================================
  # Prometheus - 指标采集与存储
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: tailor-is-prometheus
    restart: unless-stopped
    ports:
      - "9200:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - tailoris-services
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "tailoris.monitoring=prometheus"

  # ============================================================
  # Grafana - 可视化仪表盘
  # ============================================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: tailor-is-grafana
    restart: unless-stopped
    ports:
      - "9201:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - tailoris-services
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "tailoris.monitoring=grafana"
    depends_on:
      prometheus:
        condition: service_healthy

  # ============================================================
  # AlertManager - 告警管理
  # ============================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: tailor-is-alertmanager
    restart: unless-stopped
    ports:
      - "9202:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - tailoris-services
    labels:
      - "tailoris.monitoring=alertmanager"

  # ============================================================
  # Node Exporter - 宿主机指标采集
  # ============================================================
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: tailor-is-node-exporter
    restart: unless-stopped
    ports:
      - "9203:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - tailoris-services
    labels:
      - "tailoris.monitoring=node-exporter"

networks:
  tailoris-services:
    external: true

volumes:
  prometheus_data:
    name: tailor-is-prometheus-data
  grafana_data:
    name: tailor-is-grafana-data
  alertmanager_data:
    name: tailor-is-alertmanager-data