      SPRING_CLOUD_NACOS_CONFIG_USERNAME: ${NACOS_USERNAME:-}
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: ${NACOS_PASSWORD:-}
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/tailor_is_user?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-tailor}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: localhost
