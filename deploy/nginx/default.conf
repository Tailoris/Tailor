# ==============================================================================
# Tailor IS Nginx 配置 (HTTP + HTTPS)
# ==============================================================================
# 说明:
#   - 开发环境: 仅使用 HTTP (80 端口)
#   - 生产环境: 启用 HTTPS (443 端口) + HTTP->HTTPS 重定向
#   - SSL 证书路径: /etc/nginx/ssl/fullchain.pem, /etc/nginx/ssl/privkey.pem
# ==============================================================================

# 速率限制 zone 定义 (http 上下文)
include /etc/nginx/rate-limiting.conf;

# ==============================================================================
# SSL 全局参数 (http 上下文)
# ==============================================================================
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_session_tickets off;

# ==============================================================================
# HTTP 服务器 (80 端口) - 开发/测试环境
# ==============================================================================
server {
    listen 80;
    server_name localhost;

    # ========== HTTP → HTTPS 重定向（生产环境启用） ==========
    # return 301 https://$host$request_uri;
    # 开发环境禁用HTTPS重定向，避免无证书导致的访问失败

    # ========== 安全响应头 ==========
    include /etc/nginx/security-headers.conf;

    # ========== 静态资源缓存 ==========
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
        try_files $uri =404;
    }

    # ========== 健康检查端点 ==========
    location = /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ========== PC商城首页 ==========
    location / {
        root /usr/share/nginx/html/pc-mall;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ========== 商户后台 ==========
    location /merchant/ {
        alias /usr/share/nginx/html/merchant-admin/;
        index index.html;
        try_files $uri $uri/ /merchant/index.html;
    }

    # ========== 平台管理后台 ==========
    location /admin/ {
        alias /usr/share/nginx/html/platform-admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ========== Actuator 端点 - 禁止外网访问 ==========
    location ~* /actuator/ {
        deny all;
        return 403;
    }

    # ========== API 反向代理 - 核心网关 ==========
    # 登录接口速率限制 10r/m (防暴力破解)
    location /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 🔒 M-19修复: 支付接口速率限制 5r/m (高价值接口，严格限制)
    location /api/pay/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 🔒 M-19修复: 管理员接口速率限制 10r/m (敏感操作，严格限制)
    location /api/admin/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/products/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========== WebSocket 代理配置 (IM 服务) ==========
    location /ws/ {
        proxy_pass http://localhost:8114;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ========== 日志 ==========
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}

# ==============================================================================
# HTTPS 服务器 (443 端口) - 生产环境 (默认启用)
# ==============================================================================
# 证书配置说明:
#   1. 开发/测试环境: 使用自签名证书
#      ./deploy/scripts/generate-ssl-cert.sh
#   2. 生产环境: 使用 Let's Encrypt 免费证书
#      ./deploy/scripts/generate-letsencrypt-cert.sh
#   3. 正式 SSL 证书: 将证书文件放入 /etc/nginx/ssl/ 目录
#      - 证书文件: /etc/nginx/ssl/fullchain.pem
#      - 私钥文件: /etc/nginx/ssl/privkey.pem
#   4. 若暂时没有 SSL 证书，可注释掉 HTTPS server 块，仅使用 HTTP (80 端口)
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localhost;

    # ========== SSL 证书 ==========
    # 正式环境请替换为真实证书文件路径
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ========== OCSP Stapling ==========
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ========== 安全响应头 ==========
    include /etc/nginx/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ========== Actuator 端点 - 禁止外网访问 (🔒 C-14修复: HTTPS 块补充 deny 规则) ==========
    location ~* /actuator/ {
        deny all;
        return 403;
    }

    # ========== 静态资源缓存 ==========
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ========== 健康检查端点 ==========
    location = /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ========== PC商城首页 ==========
    location / {
        root /usr/share/nginx/html/pc-mall;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ========== 商户后台 ==========
    location /merchant/ {
        alias /usr/share/nginx/html/merchant-admin/;
        index index.html;
        try_files $uri $uri/ /merchant/index.html;
    }

    # ========== 平台管理后台 ==========
    location /admin/ {
        alias /usr/share/nginx/html/platform-admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ========== API 反向代理 - 核心网关 ==========
    location /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 🔒 M-19修复: 支付接口速率限制 5r/m (高价值接口，严格限制)
    location /api/pay/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 🔒 M-19修复: 管理员接口速率限制 10r/m (敏感操作，严格限制)
    location /api/admin/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========== 日志 ==========
    access_log /var/log/nginx/https-access.log;
    error_log /var/log/nginx/https-error.log warn;
}
