sonar.projectKey=tailor-is
sonar.projectName=Tailor IS v4.0
sonar.projectVersion=4.0.0

sonar.sources=tailor-is
sonar.java.binaries=tailor-is/target

sonar.java.libraries=tailor-is/**/target/classes
sonar.java.test.binaries=tailor-is/**/target/test-classes

sonar.exclusions=**/node_modules/**,**/.git/**,**/target/**,**/dist/**,**/build/**

sonar.java.source=21
sonar.java.target=21

sonar.qualitygate.wait=true

sonar.branch.name=main

sonar.custom.rules.file=deploy/sonar/sonar-rules-custom.yaml

sonar.rules.enabled=RP-001,RP-002,RP-003,RP-004,RP-005,RP-006,DC-001,NG-001

sonar.web.javaAdditionalOpts=-Dsonar.web.port=9000

sonar.jdbc.url=jdbc:postgresql://localhost:5432/sonarqube
sonar.jdbc.username=sonar
sonar.jdbc.password=sonar